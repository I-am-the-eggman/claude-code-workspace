<!--
=============================================================
セットアップ手順
=============================================================

1. このファイルをローカルまたはWebサーバーに配置する
   - ローカルで開く場合: ブラウザで index.html をそのまま開く
   - カメラ機能やAPIキー保護のため HTTPS 環境を推奨

2. 初回起動時に「設定」パネルが表示されるので以下を入力する:
   - Anthropic APIキー
       https://console.anthropic.com/ からAPIキーを取得する
   - Google Apps Script WebアプリURL
       spreadsheet-post.gs をデプロイして取得したURLを貼り付ける
   - デフォルトシート名（省略時は Sheet1）

3. 設定を保存したあと、日計票の写真をアップロードして使用する

注意: APIキーはブラウザの localStorage に保存されます。
      共有PCでは使用後にブラウザのストレージをクリアしてください。

=============================================================
-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日計票スキャン</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
      padding: 16px;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    header h1 { font-size: 1.2rem; font-weight: 700; }

    #gear-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.4rem;
      padding: 4px;
      color: #555;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #444;
    }

    label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: .95rem;
      margin-bottom: 14px;
      outline: none;
      transition: border-color .2s;
    }

    input:focus { border-color: #4a90e2; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, background .2s;
    }

    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: #4a90e2; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #357abd; }
    .btn-success { background: #27ae60; color: #fff; }
    .btn-success:hover:not(:disabled) { background: #1e8449; }

    .notice {
      background: #fff8e1;
      border-left: 3px solid #f5a623;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: .8rem;
      color: #7a5c00;
      margin-bottom: 14px;
    }

    #drop-zone {
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      color: #888;
      font-size: .9rem;
      transition: border-color .2s, background .2s;
      margin-bottom: 14px;
    }

    #drop-zone.dragover {
      border-color: #4a90e2;
      background: #eef4fd;
    }

    #drop-zone .drop-icon { font-size: 2rem; margin-bottom: 8px; }
    #file-input { display: none; }

    /* 複数プレビュー */
    #preview-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .preview-item {
      position: relative;
      width: calc(33.33% - 6px);
    }

    .preview-item img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      border-radius: 6px;
      border: 2px solid #ddd;
    }

    .preview-item .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,.55);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: .75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-item .file-name {
      font-size: .7rem;
      color: #666;
      text-align: center;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 読み取り進捗 */
    .progress-bar-wrap {
      background: #eee;
      border-radius: 4px;
      height: 6px;
      margin-bottom: 10px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      height: 100%;
      background: #4a90e2;
      transition: width .3s;
    }

    .result-table-wrap { overflow-x: auto; margin-bottom: 14px; }

    table { width: 100%; border-collapse: collapse; font-size: .9rem; }

    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid #eee;
    }

    th { background: #f9f9f9; font-weight: 700; color: #555; }

    td[contenteditable="true"] { background: #fafff4; outline: none; min-width: 60px; }
    td[contenteditable="true"]:focus {
      background: #efffdf;
      box-shadow: inset 0 0 0 1px #7ed957;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: .78rem;
      font-weight: 600;
    }

    .badge-in  { background: #e8f5e9; color: #2e7d32; }
    .badge-out { background: #fce4ec; color: #c62828; }

    .total-row {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      font-weight: 700;
      font-size: .95rem;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .msg {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: .88rem;
      margin-bottom: 12px;
    }

    .msg-error   { background: #fdecea; color: #b71c1c; border: 1px solid #ef9a9a; }
    .msg-success { background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="app">

  <header>
    <h1>📋 日計票スキャン</h1>
    <button id="gear-btn" title="設定を開く">⚙️</button>
  </header>

  <!-- ステップ1：設定 -->
  <section class="card" id="settings-panel">
    <h2>設定</h2>
    <div class="notice">
      ⚠️ APIキーはこのブラウザの localStorage に保存されます。共有PCでは使用後にブラウザのストレージをクリアしてください。
    </div>

    <label for="api-key">Anthropic APIキー</label>
    <input type="password" id="api-key" placeholder="sk-ant-..." autocomplete="off" />

    <label for="gas-url">Google Apps Script WebアプリURL</label>
    <input type="text" id="gas-url" placeholder="https://script.google.com/macros/s/.../exec" />

    <label for="sheet-name">デフォルトシート名</label>
    <input type="text" id="sheet-name" value="Sheet1" />

    <label for="proxy-url">Anthropic APIエンドポイント（プロキシ使用時は変更）</label>
    <input type="text" id="proxy-url" placeholder="http://localhost:3001" />
    <div style="font-size:.78rem;color:#888;margin-top:-10px;margin-bottom:14px;">
      CORSエラーが出る場合は <code>node proxy.js</code> を起動し <code>http://localhost:3001</code> を入力してください
    </div>

    <button class="btn btn-primary" id="save-settings-btn">設定を保存</button>
    <div id="settings-msg"></div>
  </section>

  <!-- ステップ2：アップロード -->
  <section class="card hidden" id="upload-panel">
    <h2>日計票をアップロード</h2>

    <div id="drop-zone">
      <div class="drop-icon">📷</div>
      <div>クリックまたは写真をドラッグ＆ドロップ</div>
      <div style="font-size:.8rem;margin-top:4px;color:#aaa">複数枚まとめて選択可 · JPG・PNG など</div>
    </div>
    <input type="file" id="file-input" accept="image/*" multiple />

    <div id="preview-list"></div>

    <div id="upload-msg"></div>

    <button class="btn btn-primary" id="read-btn" disabled>
      金額を読み取る
    </button>
  </section>

  <!-- ステップ3：確認・送信 -->
  <section class="card hidden" id="result-panel">
    <h2>読み取り結果</h2>

    <div class="progress-bar-wrap" id="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="result-table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:36px"></th>
            <th>日付</th>
            <th>金額</th>
            <th>種別</th>
          </tr>
        </thead>
        <tbody id="result-tbody"></tbody>
      </table>
    </div>

    <div class="total-row">
      <div>入金合計: <span id="total-in">0</span> 円</div>
      <div>出金合計: <span id="total-out">0</span> 円</div>
    </div>

    <div id="result-msg"></div>

    <button class="btn btn-success" id="send-btn">
      Googleスプレッドシートに送る
    </button>
  </section>

</div>
<script>
  // ─── 状態 ───────────────────────────────────────────────
  // { base64: string, mime: string, name: string }[]
  let pendingFiles = [];

  // ─── DOM ────────────────────────────────────────────────
  const settingsPanel = document.getElementById("settings-panel");
  const uploadPanel   = document.getElementById("upload-panel");
  const resultPanel   = document.getElementById("result-panel");
  const gearBtn       = document.getElementById("gear-btn");
  const saveBtn       = document.getElementById("save-settings-btn");
  const readBtn       = document.getElementById("read-btn");
  const sendBtn       = document.getElementById("send-btn");
  const dropZone      = document.getElementById("drop-zone");
  const fileInput     = document.getElementById("file-input");
  const previewList   = document.getElementById("preview-list");
  const resultTbody   = document.getElementById("result-tbody");
  const progressWrap  = document.getElementById("progress-wrap");
  const progressBar   = document.getElementById("progress-bar");

  // ─── 初期化 ─────────────────────────────────────────────
  function init() {
    const s = loadSettings();
    if (s.apiKey)    document.getElementById("api-key").value    = s.apiKey;
    if (s.gasUrl)    document.getElementById("gas-url").value    = s.gasUrl;
    if (s.sheetName) document.getElementById("sheet-name").value = s.sheetName;
    if (s.proxyUrl)  document.getElementById("proxy-url").value  = s.proxyUrl;

    if (s.apiKey && s.gasUrl) {
      settingsPanel.classList.add("hidden");
      uploadPanel.classList.remove("hidden");
    }
  }

  // ─── localStorage ────────────────────────────────────────
  function loadSettings() {
    try { return JSON.parse(localStorage.getItem("nikkeihyo_settings") || "{}"); }
    catch { return {}; }
  }

  function persistSettings(obj) {
    localStorage.setItem("nikkeihyo_settings", JSON.stringify(obj));
  }

  // ─── 設定保存 ────────────────────────────────────────────
  saveBtn.addEventListener("click", () => {
    const apiKey    = document.getElementById("api-key").value.trim();
    const gasUrl    = document.getElementById("gas-url").value.trim();
    const sheetName = document.getElementById("sheet-name").value.trim() || "Sheet1";
    const proxyUrl  = document.getElementById("proxy-url").value.trim().replace(/\/$/, "");

    if (!apiKey) { showMsg("settings-msg", "APIキーを入力してください", "error"); return; }
    if (!gasUrl) { showMsg("settings-msg", "GAS URLを入力してください",  "error"); return; }

    persistSettings({ apiKey, gasUrl, sheetName, proxyUrl });
    showMsg("settings-msg", "設定を保存しました", "success");

    setTimeout(() => {
      settingsPanel.classList.add("hidden");
      uploadPanel.classList.remove("hidden");
    }, 700);
  });

  gearBtn.addEventListener("click", () => settingsPanel.classList.toggle("hidden"));

  // ─── file:// 起動チェック ────────────────────────────────
  if (location.protocol === "file:") {
    const warn = document.createElement("div");
    warn.className = "msg msg-error";
    warn.style.margin = "0 0 12px";
    warn.innerHTML = "⚠️ このファイルは <code>file://</code> で開かれています。Anthropic APIのCORS制限により<strong>動作しません</strong>。<br>ローカルサーバー経由（例: <code>node proxy.js</code>）でアクセスしてください。";
    uploadPanel.querySelector("h2").after(warn);
  }

  // ─── 画像アップロード ────────────────────────────────────
  dropZone.addEventListener("click", () => fileInput.click());

  dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("dragover");
  });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));

  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    addFiles(Array.from(e.dataTransfer.files));
  });

  fileInput.addEventListener("change", () => {
    addFiles(Array.from(fileInput.files));
    fileInput.value = "";
  });

  function addFiles(files) {
    const images = files.filter(f => f.type.startsWith("image/"));
    if (images.length === 0) {
      showMsg("upload-msg", "画像ファイルを選択してください", "error");
      return;
    }
    clearMsg("upload-msg");
    resultPanel.classList.add("hidden");

    images.forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const dataUrl = ev.target.result;
        const entry = { base64: dataUrl.split(",")[1], mime: file.type || "image/jpeg", name: file.name };
        pendingFiles.push(entry);
        renderPreviewItem(entry, pendingFiles.length - 1);
        readBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    });
  }

  function renderPreviewItem(entry, idx) {
    const div = document.createElement("div");
    div.className = "preview-item";
    div.dataset.idx = idx;
    div.innerHTML = `
      <img src="data:${entry.mime};base64,${entry.base64}" alt="${entry.name}" />
      <button class="remove-btn" title="削除">✕</button>
      <div class="file-name">${entry.name}</div>
    `;
    div.querySelector(".remove-btn").addEventListener("click", () => {
      pendingFiles.splice(idx, 1);
      div.remove();
      // インデックス振り直し
      previewList.querySelectorAll(".preview-item").forEach((el, i) => el.dataset.idx = i);
      if (pendingFiles.length === 0) readBtn.disabled = true;
    });
    previewList.appendChild(div);
  }

  // ─── Claude API 呼び出し（1枚分） ──────────────────────
  async function readOneImage(entry, apiBase, apiKey) {
    const res = await fetch(`${apiBase}/v1/messages`, {
      method: "POST",
      headers: {
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "content-type": "application/json",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-5",
        max_tokens: 4096,
        system: "日計票の画像から金額データを抽出してください。必ずJSON形式のみで返答し、preambleやmarkdownのコードブロック記号は含めないこと。写真の右上に書かれている日付も読み取ること。形式: {\"date\":\"YYYY-MM-DD\",\"rows\":[{\"amount\":数値,\"type\":\"in\"または\"out\"}]} 日付が読み取れない場合は date を null とする。入金（前受金・繰越金など大きな金額で左欄に記載）はin、支出はout。合計・小計行は除外。",
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: entry.mime, data: entry.base64 } },
            { type: "text",  text: "この日計票から日付と金額データをJSONで抽出してください。" },
          ],
        }],
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    const rawText = data.content?.[0]?.text || "";
    const jsonMatch = rawText.match(/\{[\s\S]*\}/);
    const text = jsonMatch ? jsonMatch[0] : rawText.trim();

    let parsed;
    try { parsed = JSON.parse(text); }
    catch { throw new Error(`「${entry.name}」のAI返答をJSONとして解析できませんでした。返答: ${rawText.slice(0, 100)}`); }

    if (!Array.isArray(parsed.rows) || parsed.rows.length === 0) {
      throw new Error(`「${entry.name}」から金額データを読み取れませんでした`);
    }

    return { date: parsed.date || null, rows: parsed.rows };
  }

  // ─── 全画像を順番に読み取る ─────────────────────────────
  readBtn.addEventListener("click", async () => {
    const { apiKey, proxyUrl } = loadSettings();
    if (!apiKey)              { showMsg("upload-msg", "APIキーが設定されていません", "error"); return; }
    if (pendingFiles.length === 0) { showMsg("upload-msg", "画像を選択してください", "error"); return; }

    const apiBase = proxyUrl || "https://api.anthropic.com";
    const total   = pendingFiles.length;

    setLoading(readBtn, true, `読み取り中... (0/${total})`);
    clearMsg("upload-msg");
    resultTbody.innerHTML = "";
    progressWrap.style.display = "block";
    progressBar.style.width = "0%";
    resultPanel.classList.remove("hidden");
    uploadPanel.classList.add("hidden");

    let successCount = 0;
    const errors = [];

    for (let i = 0; i < total; i++) {
      setLoading(readBtn, true, `読み取り中... (${i + 1}/${total})`);
      try {
        const { date, rows } = await readOneImage(pendingFiles[i], apiBase, apiKey);
        appendRows(date, rows);
        successCount++;
      } catch (e) {
        errors.push(e.message);
      }
      progressBar.style.width = `${Math.round((i + 1) / total * 100)}%`;
    }

    progressWrap.style.display = "none";
    setLoading(readBtn, false, "金額を読み取る");
    readBtn.disabled = false;

    if (errors.length > 0) {
      showMsg("result-msg", "⚠️ 一部エラー:<br>" + errors.join("<br>"), "error");
    }
    if (successCount === 0) {
      uploadPanel.classList.remove("hidden");
      resultPanel.classList.add("hidden");
    }
  });

  // ─── 結果テーブルへ行を追加 ─────────────────────────────
  function appendRows(date, rows) {
    rows.forEach((row) => {
      const tr = document.createElement("tr");
      const isIn = row.type === "in";
      tr.dataset.type = row.type;
      tr.dataset.date = date || "";
      tr.innerHTML = `
        <td><input type="checkbox" checked class="row-check" /></td>
        <td contenteditable="true" class="date-cell">${date || ""}</td>
        <td contenteditable="true" class="amount-cell">${row.amount}</td>
        <td><span class="badge ${isIn ? "badge-in" : "badge-out"}">${isIn ? "入金" : "出金"}</span></td>
      `;
      resultTbody.appendChild(tr);
    });

    resultTbody.addEventListener("input",  updateTotals);
    resultTbody.addEventListener("change", updateTotals);
    updateTotals();
  }

  function updateTotals() {
    let inSum = 0, outSum = 0;
    resultTbody.querySelectorAll("tr").forEach((tr) => {
      if (!tr.querySelector(".row-check")?.checked) return;
      const amount = parseInt(tr.querySelector(".amount-cell").textContent.replace(/,/g, ""), 10) || 0;
      if (tr.dataset.type === "in") inSum += amount;
      else outSum += amount;
    });
    document.getElementById("total-in").textContent  = inSum.toLocaleString();
    document.getElementById("total-out").textContent = outSum.toLocaleString();
  }

  // ─── GAS へ送信 ─────────────────────────────────────────
  sendBtn.addEventListener("click", async () => {
    const { gasUrl, sheetName } = loadSettings();
    if (!gasUrl) { showMsg("result-msg", "GAS URLが設定されていません", "error"); return; }

    const rows = [];
    resultTbody.querySelectorAll("tr").forEach((tr) => {
      if (!tr.querySelector(".row-check")?.checked) return;
      const date   = tr.querySelector(".date-cell").textContent.trim();
      const amount = parseInt(tr.querySelector(".amount-cell").textContent.replace(/,/g, ""), 10) || 0;
      rows.push({ date, amount, type: tr.dataset.type === "in" ? "入金" : "出金" });
    });

    if (rows.length === 0) { showMsg("result-msg", "送信する行が選択されていません", "error"); return; }

    setLoading(sendBtn, true, "送信中...");
    clearMsg("result-msg");

    try {
      await fetch(gasUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rows, sheetName }),
        mode: "no-cors",
      });
      showMsg("result-msg", `✅ ${rows.length} 件をスプレッドシートに送信しました`, "success");
      sendBtn.disabled = true;
    } catch (e) {
      showMsg("result-msg", "送信に失敗しました: " + e.message, "error");
    } finally {
      setLoading(sendBtn, false, "Googleスプレッドシートに送る");
    }
  });

  // ─── ユーティリティ ─────────────────────────────────────
  function setLoading(btn, loading, label) {
    btn.disabled = loading;
    btn.innerHTML = loading ? `<span class="spinner"></span>${label}` : label;
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = `<div class="msg msg-${type}">${text}</div>`;
  }

  function clearMsg(id) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = "";
  }

  init();
</script>
</body>
</html>
